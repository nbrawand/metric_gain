<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Strength Guider has moved</title>
    <meta name="robots" content="noindex" />
    <!-- Belt and braces. Render's redirect rule 301s every path before this
         file is ever served, so reaching it means the rule is missing or
         misconfigured. No script, so it works under any CSP. -->
    <meta http-equiv="refresh" content="0; url=https://strengthguider.com/" />
    <link rel="canonical" href="https://strengthguider.com/" />
    <style>
      body {
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
      }
      a { color: #2dd4bf; }
    </style>
  </head>
  <body>
    <main>
      <h1>Strength Guider has moved</h1>
      <p>
        We are now at
        <a href="https://strengthguider.com/">strengthguider.com</a>.
      </p>
    </main>
  </body>
</html>
